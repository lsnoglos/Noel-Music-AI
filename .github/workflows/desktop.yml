name: Windows desktop smoke
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m unittest discover -v
      - run: python -m tests.desktop_smoke
      - name: Open native first-run window without interpreter discovery
        shell: powershell
        run: ./scripts/bootstrap.ps1 -SmokeMissingPython
