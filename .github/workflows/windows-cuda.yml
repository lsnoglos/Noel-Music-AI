name: Compile CUDA engine (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: x64
      - uses: Jimver/cuda-toolkit@c35baa1a18fd1fc9dcf47c5bd839bf30559c0bc3
        with:
          cuda: '12.8.1'
          method: local
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "nvrtc", "nvrtc_dev"]'
          use-github-cache: 'false'
      - name: Build pinned SM86 server
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Package and verify
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoelMusicAI-Windows-x64
          path: |
            NoelMusicAI-Windows.zip
            NoelMusicAI-Windows.zip.sha256
          if-no-files-found: error
  preview-release:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: NoelMusicAI-Windows-x64
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          gh release create "engine-${REVISION}-${GITHUB_RUN_ID}" --repo "$REPO" --target "$REVISION" --prerelease --title "Noel Music AI · Windows CUDA preview" --notes "Motor Windows SM86 compilado y contrato CPU comprobado. Actualice el manifiesto de reutilización tras validar esta revisión." NoelMusicAI-Windows.zip NoelMusicAI-Windows.zip.sha256
