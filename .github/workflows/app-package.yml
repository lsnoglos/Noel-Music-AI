name: Noel Music AI application packages
on:
  workflow_dispatch:
  push:
    branches: [main, feature/studio-usability]
    paths: ['noel/**', 'scripts/**', 'docs/**', 'tests/**', 'NoelMusicAI.cmd', 'requirements-ui.txt', 'README.md', 'PROJECT_STATUS.md', 'CHANGELOG.md', '.github/workflows/app-package.yml']
permissions:
  contents: read
jobs:
  update:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ui.txt
      - run: python -m unittest discover -v
      - run: python -m tests.desktop_smoke
      - run: python scripts/package_app.py update
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoelMusicAI-Update
          path: |
            NoelMusicAI-Update.zip
            NoelMusicAI-Update.zip.sha256
          compression-level: 0
          if-no-files-found: error
  full:
    needs: update
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: NoelMusicAI-Update
      - run: python scripts/package_app.py full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoelMusicAI-Windows-x64
          path: |
            NoelMusicAI-Windows.zip
            NoelMusicAI-Windows.zip.sha256
          compression-level: 0
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [update, full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: NoelMusicAI-Update
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: NoelMusicAI-Windows-x64
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          gh release create "preview-${REVISION}" --repo "$REPO" --target "$REVISION" --prerelease --title "Noel Music AI · Windows preview" --notes "Motor CUDA fijado reutilizado y verificado; contrato CPU y pruebas de escritorio. Inferencia de modelos opcionales y duración larga pendiente en GPU real." NoelMusicAI-Windows.zip NoelMusicAI-Windows.zip.sha256 NoelMusicAI-Update.zip NoelMusicAI-Update.zip.sha256
